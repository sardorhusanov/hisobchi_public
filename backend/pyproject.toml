[project]
name = "work-management"
version = "0.2.0"
requires-python = ">=3.13,<3.14"
dependencies = ["aiogram>=3.15,<4", "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.30,<1", "alembic>=1.14,<2", "pydantic-settings>=2.7,<3", "fastapi>=0.121,<1", "uvicorn>=0.34,<1"]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1", "httpx>=0.28,<1"]
[tool.ruff]
line-length = 100
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
